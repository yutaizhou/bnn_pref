# * demonstrations
# for splitting demo into train/test traj. Each split is independetly turned into pref queries
# ogbench doesn't need this.
n_demos: 200
demo_train_frac: 0.8 

# * preference queries
# split n_queries into n_train (from train trajs) and n_test (from test trajs)
n_queries: 1000
train_frac: 0.8
n_queries_train: ${multiply:${.n_queries}, ${.train_frac}}
n_queries_test: ${subtract:${.n_queries}, ${.n_queries_train}}
