# * demonstrations
# for splitting demo into train/test traj. Each split is independetly turned into pref queries
# ogbench doesn't need this.
n_demos: 200
demo_train_frac: 0.8 

# * preference queries
# take nq_train / nq_test from the already split train/test trajs
nq_train: 200
nq_test: 500

noisy_label: False # t2 > t1 always if False; o.w. sample from bradley terry
bt_beta: 1.0 # beta for BT model

# * Data partitioning for streaming algs: EKF, Ensemble, etc.
nq_init: 5 
nq_update: 50 # if -1, use all remaining data after nq_init
nsteps: ${get_nsteps:${.nq_train}, ${.nq_init}, ${.nq_update}} #! do not set manually