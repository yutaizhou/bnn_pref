# * dropout agent & active learning
# dropout used for training, computing predictive & acquisition function
active: ${..active}
# M: ${..M}
M: 150
use_vmap: True # turned off for scalability experiments. whether to use vectorized NN training & prediction
chunk_size: ${..chunk_size}
acq: ${..acq} # "infogain" or "disagreement"
max_buffer_size: ${..max_buffer_size} # for keeping observed queries for training. keep it roughly around `nq_updates`

# * NN model
hidden_sizes: ${network.hidden_sizes}
n_splits: ${network.n_splits}
dropout_prob: 0.3

# * Init + Update
bs: 1
l2_reg: ${..l2_reg}

niters_init: ${..niters_init}  # Total number of GD steps on warmup data
# update_all=True: updates for `niters_update` iterations on all queries seen so far in the buffer. 
# update_all=False: updates one iteration on most recent query
# make sure to adjust `learning_rate` according to update strategy
# update_all: True 
update_all: ${..update_all}
niters_update: ${..niters_update}
# learning_rate: 0.0001
learning_rate: ${..learning_rate}