defaults:
- _self_
- task: synthetic
- mcmc: mh
- ekf: ekf
- sgd: sgd
- data: base
- optional local: default # specifies project dir & wandb login, goes after wandb
# - optional run: debug
- hydra: default

fhat: linear
chunk_size: 64

# * sanity check for active learning acquisition functions
sanity: False
sanity_frac: 0.01 # 1% of nq_train=5000 is 50, nq_update=50

paths:
  results_dir: ${paths.root_dir}/results
  sweep_dir: ${paths.root_dir}/results_sweep
  output_dir: ${hydra:runtime.output_dir}

  prefcc:
    data_dir: ${paths.prefcc_dir}


seed: -1 # for jr.key()
seeds: 1 # for jax.vmap()
show_fig: False
save_fig: False