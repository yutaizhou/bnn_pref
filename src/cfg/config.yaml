defaults:
- _self_ # non-defaults are loaded first for this config
- task: synthetic
- data: base
- network: 64x2
# algs: mcmc, ekf, sgd, do
- mcmc: mh
- ekf: ekf
- sgd: sgd
- do: do
- llmcmc: llmcmc
- laplace: laplace
- rl: iql
- optional local: default # specifies project dir & wandb login
# - optional run: debug
- hydra: default

verbose: True # for tqdm in belief updates and SGD steps
fhat: linear # only used for synthetic tasks
M: 100 # number of models / samples for ensembling / EKF sampling
active: False # active vs. random querying
acq: "infogain" # "infogain" or "disagreement"
use_vmap: True # whether to use vmap for algorithm components, keep in mind ensemble size `M`
chunk_size: 128 # for jax.lax.map()
seed_vmap: True # whether to use vmap to parallelize run seeds. good for 3 seeds or under
coverage_alpha: 0.95 # prediction coverage alpha for evaluation

dir_extra: null # extra str to append to a hydra directory

# * sanity check for active learning acquisition functions
sanity: False # whether to make duplicate queries; for unit testing of acquisiont function.s
sanity_frac: 0.01 # fraction of non-duplicates in the query pool. 1% of nq_train=5000 is 50, nq_update=50 

paths:
  results_dir: ${paths.root_dir}/results
  sweep_dir: ${paths.root_dir}/results_sweep
  output_dir: ${hydra:runtime.output_dir} # set by results_dir & sweep_dir in hydra config
  ckpts_dir: ${paths.output_dir}/ckpts

  prefcc:
    data_dir: ${paths.prefcc_dir}
  vd4rl_dir: /scr/shared/datasets/vd4rl
  unirlhf_dir: /scr/yutaizho/code/p-prefEKF/bnn_pref/unirlhf_crowdsource_human_labels


seed: -1 # for jr.key() - initial random seeding
seeds: 1 # for jax.vmap() - number of seeds to run
show_fig: False
save_fig: False

# for gradient descent methods
max_buffer_size: 500 # for keeping observed queries for training. keep it roughly around `nq_updates`
bs: 8 # batch size for training
learning_rate: 0.003
l2_reg: 0.0

# make sure to adjust `learning_rate` according to update strategy
# niters_{init,update} notation: >0 for num minibatches, -1 for 1 epoch, -2 for 2 epochs, etc
niters_init: 420 # number of GD steps on init_belief(); 0 amounts to not using warmup data
niters_update: 10 # number of GD steps on update_belief()