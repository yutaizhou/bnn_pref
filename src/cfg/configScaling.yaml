defaults:
- config

paths:
  results_dir: ${paths.root_dir}/results/scaling
  sweep_dir: ${paths.root_dir}/results_sweep/scaling

hydra:
  run:
    dir: ${paths.results_dir}/${now:%Y%m%d_%H%M%S}_M=${M}_net=${hydra.runtime.choices.network}

  sweep:
    dir: ${paths.sweep_dir}/${now:%Y%m%d_%H%M%S}_${dir_extra}_nitersUpdate=${niters_update}_iekf=${ekf.iekf}
    subdir: ${hydra.job.num}_M=${M}_net=${hydra.runtime.choices.network}

